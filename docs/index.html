<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mahāsatipaṭṭhāna Sutta in tables: Pali in IAST, Cyrillic or Devanagari, with an English and Russian translation and an audio explanation for every line.">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Mahāsatipaṭṭhāna Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Noto+Sans:wght@400;600&family=Tiro+Devanagari+Sanskrit&display=swap">
<style>
/* Layout: a printed study sheet. Ink-ruled boxes and arrows on paper; the line being explained is marked as if with a highlighter. */
:root {
  --paper: #F3F3EF;
  --sheet: #FFFFFD;
  --ink: #1C1B18;
  --rule: #2E2C27;
  --muted: #69655B;
  --hair: #DCD9CF;
  --ochre: #94570A;
  --mark: #FBE29A;
  --hover: #F3ECDC;
  --bar: #1F1E1A;
  --bar-fg: #F4F2EC;
  --bar-muted: #B5B0A4;
  --bar-track: #3A3833;
  --bar-accent: #E9AA50;
  --bar-on-accent: #1F1E1A;
  --f-text: "Gentium Book Plus", "Noto Serif", "Times New Roman", serif;
  --f-deva: "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
  --f-ui: "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --lw: 1.5px;
  --pl-h: 150px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11110F; --sheet: #191916; --ink: #ECE9E1; --rule: #C8C3B5; --muted: #A29D91;
    --hair: #34322C; --ochre: #E7A84E; --mark: #5B4613; --hover: #25221A;
    --bar: #2A2924; --bar-fg: #ECE9E1; --bar-muted: #A29D91; --bar-track: #45433C;
    --bar-accent: #E9AA50; --bar-on-accent: #1F1E1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11110F; --sheet: #191916; --ink: #ECE9E1; --rule: #C8C3B5; --muted: #A29D91;
  --hair: #34322C; --ochre: #E7A84E; --mark: #5B4613; --hover: #25221A;
  --bar: #2A2924; --bar-fg: #ECE9E1; --bar-muted: #A29D91; --bar-track: #45433C;
  --bar-accent: #E9AA50; --bar-on-accent: #1F1E1A;
  color-scheme: dark;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-text);
  font-size: 17px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
body.has-player { padding-bottom: calc(var(--pl-h) + 28px); }

.sheet {
  max-width: 880px;
  margin: 0 auto;
  background: var(--sheet);
  border: 1px solid var(--hair);
  padding: clamp(20px, 4.5vw, 48px);
  display: grid;
  gap: 2.5rem;
}

/* ---------- header ---------- */
.top { display: grid; gap: .9rem; }
.eyebrow {
  margin: 0;
  font-family: var(--f-ui);
  font-size: .75rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
h1 {
  margin: 0;
  font-size: clamp(1.75rem, 4.2vw, 2.4rem);
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -.01em;
  text-wrap: balance;
}
.credit { margin: 0; color: var(--muted); max-width: 60ch; }

.tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .75rem 1.5rem;
  font-family: var(--f-ui);
  font-size: .8125rem;
  padding-top: .9rem;
  border-top: 1px solid var(--hair);
}
.seg { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.seg-label { color: var(--muted); letter-spacing: .04em; }
.seg-opts { display: flex; flex-wrap: wrap; padding: 0 1px 1px 0; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.seg label {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 1px;
  padding: .34rem .7rem;
  margin: 0 -1px -1px 0;
  border: 1px solid var(--rule);
  cursor: pointer;
  line-height: 1.2;
  white-space: nowrap;
}
.seg label:hover { background: var(--hover); }
.seg input:checked + label { background: var(--ink); color: var(--sheet); z-index: 1; }
.seg input:focus-visible + label { outline: 2px solid var(--ochre); outline-offset: 2px; z-index: 2; }
.o-ex { font-family: var(--f-text); font-size: .82rem; color: var(--muted); }
.seg input:checked + label .o-ex { color: inherit; opacity: .75; }
.seg label[lang="hi"], .seg label[lang="hi"] .o-ex { font-family: var(--f-deva); }

.play-all {
  all: unset;
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  padding: .45rem .95rem .45rem .75rem;
  border: 1px solid var(--rule);
  cursor: pointer;
  font-weight: 600;
  margin-left: auto;
}
.play-all:hover { background: var(--hover); }
.play-all:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
.play-all svg { width: 14px; height: 14px; fill: currentColor; }
.hint { margin: 0; font-family: var(--f-ui); font-size: .8125rem; color: var(--muted); }

/* ---------- text units ---------- */
.script-dev .t { font-family: var(--f-deva); font-size: 1.04em; }
.ml { white-space: pre-line; }

.ln {
  all: unset;
  box-sizing: border-box;
  display: flex;
  align-items: baseline;
  gap: .55em;
  width: 100%;
  padding: .34em .65em;
  cursor: pointer;
  scroll-margin: 90px 0 calc(var(--pl-h) + 20px);
  transition: background-color .15s;
}
.ln:hover { background: var(--hover); }
.ln.on { background: var(--mark); }
.ln:focus-visible { outline: 2px solid var(--ochre); outline-offset: -2px; }
.ln .n { color: var(--muted); min-width: 2.1em; flex: none; font-variant-numeric: tabular-nums; }
.ln .t { min-width: 0; }

/* ---------- sections ---------- */
.sec { display: grid; gap: .75rem; }
.sec-h {
  margin: 0;
  font-size: 1.2rem;
  line-height: 1.35;
  font-weight: 700;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: .2rem .6rem;
  text-wrap: balance;
}
.sec-h .n { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.sec-h .gl { font-weight: 400; font-style: italic; font-size: .85em; color: var(--muted); }
.tr { font-family: var(--f-ui); font-size: .8125rem; color: var(--muted); margin: 0; }
.tr-l { display: block; }
.sec-h + .tr { margin-top: -.45rem; }

.prose { margin: 0; max-width: 68ch; }
.prose .ln {
  display: inline;
  width: auto;
  padding: .06em .12em;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

.box { border: var(--lw) solid var(--rule); background: var(--sheet); }
.stack { display: grid; }
.stack > .ln + .ln { border-top: var(--lw) solid var(--rule); }

/* arrows */
.arr { display: flex; color: var(--rule); }
.arr-r { align-items: center; min-width: 2.75rem; }
.arr-r::before { content: ""; flex: 1; border-top: var(--lw) solid currentColor; }
.arr-r::after { content: ""; border-left: 8px solid currentColor; border-block: 4.5px solid transparent; }
.arr-d { flex-direction: column; align-items: center; height: 1.6rem; }
.arr-d::before { content: ""; flex: 1; border-left: var(--lw) solid currentColor; }
.arr-d::after { content: ""; border-top: 8px solid currentColor; border-inline: 4.5px solid transparent; }
.m-only { display: none; }

/* uddesa diagram */
.ud {
  display: grid;
  grid-template-columns: max-content minmax(2.75rem, 5rem) minmax(0, 1fr);
  grid-template-areas: "l a list" ". . fb";
  align-items: center;
  margin-top: .5rem;
}
.ud > .lbox { grid-area: l; }
.ud > .ud-a { grid-area: a; }
.ud > .list { grid-area: list; }
.ud > .ud-d { display: none; }
.ud > .fb { grid-area: fb; }
.lbox .ln { flex-direction: column; align-items: center; text-align: center; padding: .7em 1em; line-height: 1.55; }

.fb {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(2.5rem, 4rem) minmax(0, 1fr);
  align-items: stretch;
}
.fb > .c { grid-column: 1; justify-self: center; }
.fb > .c.box { min-width: 0; }
.fb > .c.box .ln { justify-content: center; text-align: center; }
.fb > .an { grid-column: 1; border: var(--lw) solid var(--rule); border-top: 0; background: var(--sheet); }
.fb > .an.first { border-top: var(--lw) solid var(--rule); }
.fb > .ra { grid-column: 2; align-self: center; }
.fb > .rbox { grid-column: 3; grid-row: 6 / span 4; display: grid; grid-template-rows: repeat(4, 1fr); }
@supports (grid-template-rows: subgrid) {
  .fb > .rbox { grid-template-rows: subgrid; }
}
.rbox .ln { align-items: center; }

/* brackets */
.bf {
  display: grid;
  grid-template-columns: max-content minmax(2.75rem, 6rem) max-content;
  justify-content: center;
  align-items: center;
  margin-block: .25rem;
}
.brk { position: relative; display: grid; padding: .3rem .85rem; }
.brk::before, .brk::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: .5rem;
  border: var(--lw) solid var(--rule);
}
.brk::before { left: 0; border-right: 0; }
.brk::after { right: 0; border-left: 0; }
.brk .ln { padding: .14em .4em; }
.lead { margin: 0; }
.lead.indent { padding-left: clamp(1rem, 12vw, 9rem); }
.lead .ln, .solo .ln { display: inline-flex; width: auto; }

.cap { margin: 0; text-align: center; display: grid; gap: .2rem; justify-items: center; }
.cap .t { font-style: italic; color: var(--muted); max-width: 62ch; }
.script-dev .cap .t { font-style: normal; }
.cap .tr { max-width: 62ch; }

.ten {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 1.75rem;
  row-gap: .1rem;
}
.ten .ln { padding: .3em .45em; }

.supp { display: grid; gap: .6rem; border-top: 1px dashed var(--rule); padding-top: 1rem; margin-top: .5rem; }
.supp-label {
  margin: 0;
  font-family: var(--f-ui);
  font-size: .75rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
.supp .stack-plain { display: grid; gap: .15rem; }
.supp .hi-block { display: grid; gap: .3rem; padding-left: .65em; }
.supp .hi-block .t { font-style: italic; color: var(--muted); }
.script-dev .supp .hi-block .t { font-style: normal; }

/* ---------- footer ---------- */
.foot { display: grid; gap: 1rem; border-top: 1px solid var(--hair); padding-top: 1.25rem; font-family: var(--f-ui); font-size: .8125rem; color: var(--muted); }
.foot p { margin: 0; max-width: 70ch; }
.scan summary { cursor: pointer; color: var(--ink); font-weight: 600; width: fit-content; }
.scan summary:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
.scan img { display: block; margin-top: .9rem; width: 100%; max-width: 560px; height: auto; border: 1px solid var(--hair); }

/* ---------- player ---------- */
.player {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: var(--bar);
  color: var(--bar-fg);
  font-family: var(--f-ui);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.pl-in {
  max-width: 880px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
}
.pl-ctl { display: flex; gap: 2px; align-items: center; }
.ib {
  all: unset;
  box-sizing: border-box;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  cursor: pointer;
  color: var(--bar-fg);
}
.ib:hover { background: var(--bar-track); }
.ib:focus-visible { outline: 2px solid var(--bar-accent); outline-offset: 1px; }
.ib svg { width: 16px; height: 16px; fill: currentColor; }
.ib.main { width: 44px; height: 44px; background: var(--bar-accent); color: var(--bar-on-accent); }
.ib.main:hover { background: var(--bar-accent); filter: brightness(1.08); }
.ib:disabled { opacity: .35; cursor: default; }
.pl-info { min-width: 0; display: grid; gap: 6px; max-height: min(46vh, 340px); overflow-y: auto; }
.pl-text { font-family: var(--f-text); font-size: 1.05rem; line-height: 1.35; }
.pl-tr { display: grid; gap: 3px; font-size: .84rem; line-height: 1.4; }
.pl-tr p { margin: 0; display: grid; grid-template-columns: 1.9rem minmax(0, 1fr); gap: .4rem; }
.pl-tag { font-size: .66rem; letter-spacing: .08em; color: var(--bar-muted); padding-top: .22em; }
.script-dev .pl-text { font-family: var(--f-deva); }
.pl-meta { font-size: .75rem; color: var(--bar-muted); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 0 .9em; }
.pl-track { height: 3px; background: var(--bar-track); }
.pl-prog { display: block; height: 100%; width: 0; background: var(--bar-accent); }

@media (max-width: 640px) {
  body { font-size: 16px; padding-block: 16px 32px; }
  .sheet { border: 0; padding: 4px 0 0; background: transparent; gap: 2.25rem; }
  .box, .fb > .an { background: transparent; }
  .play-all { margin-left: 0; }
  .d-only { display: none; }
  .m-only { display: flex; }
  .ud { grid-template-columns: minmax(0, 1fr); grid-template-areas: "l" "a" "list" "fb"; }
  .ud > .ud-a { display: none; }
  .ud > .ud-d { display: flex; grid-area: a; }
  .ud > .lbox { justify-self: center; }
  .lbox .ln { padding: .5em 1.4em; }
  .fb { display: flex; flex-direction: column; }
  .fb > .c { align-self: center; }
  .fb > .ra { display: none; }
  .fb > .rbox { display: grid; grid-template-rows: none; }
  .bf { grid-template-columns: max-content; }
  .bf > .arr-r { display: none; }
  .bf > .arr-d { justify-self: center; }
  .ten { grid-template-columns: minmax(0, 1fr); }
  .lead.indent { padding-left: 1.5rem; }
  .pl-in { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; }
  .pl-info { grid-column: 1 / -1; grid-row: 1; }
  .pl-ctl { grid-row: 2; }
  #pl-close { grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) {
  .ln { transition: none; }
}
</style>
</head>
<body>
<main class="sheet" id="sheet">
  <header class="top">
    <p class="eyebrow">DN 22 · <span data-i18n="page"></span></p>
    <h1>Mahāsatipaṭṭhāna Sutta</h1>
    <p class="credit" data-i18n="credit"></p>
    <div class="tools">
      <div class="seg" role="radiogroup" aria-labelledby="lbl-script">
        <span class="seg-label" id="lbl-script" data-i18n="script"></span>
        <span class="seg-opts">
          <input type="radio" name="script" id="sc-iast" value="iast"><label for="sc-iast" data-i18n-title="tIast"><span>IAST</span><span class="o-ex">kāya</span></label>
          <input type="radio" name="script" id="sc-plain" value="plain"><label for="sc-plain" data-i18n-title="tPlain"><span>Latin</span><span class="o-ex">kaya</span></label>
          <input type="radio" name="script" id="sc-cyr" value="cyr"><label for="sc-cyr" data-i18n-title="tCyr"><span>Кириллица</span><span class="o-ex">кая</span></label>
          <input type="radio" name="script" id="sc-cyrs" value="cyrs"><label for="sc-cyrs" data-i18n-title="tCyrs"><span>С диакритикой</span><span class="o-ex">ка&#772;йа</span></label>
          <input type="radio" name="script" id="sc-dev" value="dev"><label for="sc-dev" lang="hi" data-i18n-title="tDev"><span>देवनागरी</span><span class="o-ex">काय</span></label>
        </span>
      </div>
      <div class="seg" role="radiogroup" aria-labelledby="lbl-lang">
        <span class="seg-label" id="lbl-lang" data-i18n="translation"></span>
        <span class="seg-opts">
          <input type="radio" name="lang" id="lg-en" value="en"><label for="lg-en">EN</label>
          <input type="radio" name="lang" id="lg-ru" value="ru"><label for="lg-ru">RU</label>
        </span>
      </div>
      <button class="play-all" id="play-all" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true" id="pa-icon"><path d="M3 1.5v13l11-6.5z"/></svg>
        <span id="pa-label"></span>
      </button>
    </div>
    <p class="hint" data-i18n="hint"></p>
  </header>

  <!-- (1) Prasaṅga -->
  <section class="sec" id="s1">
    <h2 class="sec-h">
      <span class="n" data-n="1" data-f="(%)"></span>
      <span class="t" data-l="hi" data-dev="प्रसंग" data-iast="prasaṅg"></span>
      <span class="gl"><span class="t" data-l="hi" data-dev="(= पृष्ठभूमि)" data-iast="(= pṛṣṭhbhūmi)"></span></span>
    </h2>
    <p class="tr" data-en="Occasion (= background)" data-ru="Повод (= предыстория)"></p>
    <p class="prose">
      <span class="ln" role="button" tabindex="0" data-id="1.01"><span class="t" data-l="pi" data-cap data-dev="एवं मे सुतं –"></span></span>
      <span class="ln" role="button" tabindex="0" data-id="1.02"><span class="t" data-l="pi" data-dev="एकं समयं भगवा कुरूसु विहरति कम्मासधम्मं नाम कुरूनं निगमो।"></span></span>
      <span class="ln" role="button" tabindex="0" data-id="1.03"><span class="t" data-l="pi" data-cap data-dev="तत्र खो भगवा भिक्खू आमन्तेसि – “भिक्खवो”ति।"></span></span>
      <span class="ln" role="button" tabindex="0" data-id="1.04"><span class="t" data-l="pi" data-cap data-dev="“भद्दन्ते”ति ते भिक्खू भगवतो पच्चस्सोसुं।"></span></span>
      <span class="ln" role="button" tabindex="0" data-id="1.05"><span class="t" data-l="pi" data-cap data-dev="भगवा एतदवोच –"></span></span>
    </p>
  </section>

  <!-- (2) Uddeso -->
  <section class="sec" id="s2">
    <h2 class="sec-h">
      <span class="n" data-n="2" data-f="(%)"></span>
      <span class="t" data-l="pi" data-cap data-dev="उद्देसो"></span>
      <span class="gl"><span class="t" data-l="hi" data-dev="(= संक्षिप्त सार)" data-iast="(= saṅkṣipt sār)"></span></span>
    </h2>
    <p class="tr" data-en="Summary (= the essence in brief)" data-ru="Краткое изложение (= суть в двух словах)"></p>

    <div class="ud">
      <div class="box lbox">
        <button class="ln" type="button" data-id="1.06"><span class="t ml" data-l="pi" data-cap data-dev="“एकायनो&#10;अयं,&#10;भिक्खवे,&#10;मग्गो"></span></button>
      </div>
      <span class="arr arr-r ud-a" aria-hidden="true"></span>
      <span class="arr arr-d ud-d" aria-hidden="true"></span>
      <div class="box stack list">
        <button class="ln" type="button" data-id="1.07"><span class="n" data-n="1" data-f="(%)"></span><span class="t" data-l="pi" data-dev="सत्तानं विसुद्धिया,"></span></button>
        <button class="ln" type="button" data-id="1.08"><span class="n" data-n="2" data-f="(%)"></span><span class="t" data-l="pi" data-dev="सोकपरिदेवानं समतिक्कमाय,"></span></button>
        <button class="ln" type="button" data-id="1.09"><span class="n" data-n="3" data-f="(%)"></span><span class="t" data-l="pi" data-dev="दुक्खदोमनस्सानं अत्थङ्गमाय,"></span></button>
        <button class="ln" type="button" data-id="1.10"><span class="n" data-n="4" data-f="(%)"></span><span class="t" data-l="pi" data-dev="ञायस्स अधिगमाय,"></span></button>
        <button class="ln" type="button" data-id="1.11"><span class="n" data-n="5" data-f="(%)"></span><span class="t" data-l="pi" data-dev="निब्बानस्स सच्छिकिरियाय,"></span></button>
      </div>

      <div class="fb">

  const VOWELS = 'aāiīuūeoṛ';
  const isLetter = c => /\p{L}/u.test(c);

  // Variant with diacritics: long vowels, retroflexes and nasals keep their marks (ка̄йа), y is always й
  const MACRON = String.fromCharCode(0x304), DOT = String.fromCharCode(0x323);
  const SCI_ONE = { ...CY_ONE, ā: 'а' + MACRON, ī: 'и' + MACRON, ū: 'у' + MACRON, ṛ: 'р' + DOT,
    ṅ: 'н' + String.fromCharCode(0x307), ñ: 'н' + String.fromCharCode(0x303), ṭ: 'т' + DOT, ḍ: 'д' + DOT,
    ṇ: 'н' + DOT, ḷ: 'л' + DOT, ṃ: 'м' + DOT, ṣ: 'ш' + DOT };
  const SCI_TWO = { ...CY_TWO, 'ṭh': 'т' + DOT + 'х', 'ḍh': 'д' + DOT + 'х', 'ṛh': 'р' + DOT + 'х' };

  function toCyr(src, hi, sci) {
    const ONE = sci ? SCI_ONE : CY_ONE, TWO = sci ? SCI_TWO : CY_TWO;
    const s = src.normalize('NFC'), lo = s.toLowerCase();
    let out = '';
    for (let i = 0; i < s.length;) {
      const ch = lo[i], two = lo.slice(i, i + 2), prev = i ? lo[i - 1] : ' ', nx = lo[i + 1] || ' ';
      let r, len = 1;
      if (TWO[two]) { r = TWO[two]; len = 2; }
      else if (hi && (two === 'ai' || two === 'au')) { r = two === 'ai' ? 'ай' : 'ау'; len = 2; }
      else if (!sci && ch === 'ñ' && CY_IOT[nx]) { r = 'н' + CY_IOT[nx]; len = 2; }
      else if (!sci && ch === 'y' && CY_IOT[nx]) {
        const soft = isLetter(prev) && !VOWELS.includes(prev) && prev !== 'y' && prev !== 'ṃ';
        r = (soft ? 'ь' : '') + CY_IOT[nx]; len = 2;
      }
      else if (ch === 'e' && (!isLetter(prev) || VOWELS.includes(prev))) r = 'э';
      else if (!sci && hi && ch === 'ṃ') r = 'н';
      else if (ONE[ch]) r = ONE[ch];
      else r = s[i];
      if (s[i] !== lo[i]) r = r[0].toUpperCase() + r.slice(1);
      out += r; i += len;
    }
    return out.normalize('NFC');
  }

  // ---------- interface text ----------
  const UI = {
    en: {
      page: 'Page 1 of 11',
      credit: 'Tables by Sri Bednath, Vipassana Acharya, Nepal, with every repetition of the sutta left out. Each line opens its audio explanation.',
      script: 'Script', translation: 'Language',
      playPage: 'Play page', pausePage: 'Pause',
      hint: 'Tap any line of the sutta to hear its explanation and see it translated into English and Russian.',
      demo: 'Demo: audio not linked yet', lineOf: 'Line {n} of {N}',
      supp: 'Added in the Word file · the simile of the turner',
      orig: 'Original page (scan)',
      note: 'Pali checked against the Chaṭṭha Saṅgāyana text of DN 22; misprints in the brochure are corrected.',
      prev: 'Previous line', next: 'Next line', play: 'Play', pause: 'Pause', close: 'Close player',
      tIast: 'Latin with diacritics (IAST)', tPlain: 'Latin without diacritics', tCyr: 'Cyrillic', tCyrs: 'Cyrillic with diacritics', tDev: 'Original Devanagari'
    },
    ru: {
      page: 'Страница 1 из 11',
      credit: 'Схемы Шри Беднатха, ачарьи Випассаны из Непала, без повторов, которые есть в сутте. По каждой строке открывается аудиопояснение.',
      script: 'Письмо', translation: 'Язык',
      playPage: 'Слушать страницу', pausePage: 'Пауза',
      hint: 'Нажмите на любую строку сутты, чтобы услышать объяснение и увидеть перевод на русский и английский.',
      demo: 'Демо: аудио ещё не подключено', lineOf: 'Строка {n} из {N}',
      supp: 'Добавлено в файле Word · пример с токарем',
      orig: 'Оригинал страницы (скан)',
      note: 'Текст на пали сверен с изданием Чаттха Сангаяна (DN 22); опечатки брошюры исправлены.',
      prev: 'Предыдущая строка', next: 'Следующая строка', play: 'Слушать', pause: 'Пауза', close: 'Закрыть плеер',
      tIast: 'Латиница с диакритикой (IAST)', tPlain: 'Латиница без диакритики', tCyr: 'Кириллица', tCyrs: 'Кириллица с диакритикой', tDev: 'Оригинал на деванагари'
    }
  };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let script = ['iast', 'plain', 'cyr', 'cyrs', 'dev'].includes(store.get('mspm-script')) ? store.get('mspm-script') : 'iast';
  let lang = ['en', 'ru'].includes(store.get('mspm-lang')) ? store.get('mspm-lang') : 'en';

  const SCRIPT_LANG = { iast: 'Latn', plain: 'Latn', cyr: 'Cyrl', cyrs: 'Cyrl', dev: 'Deva' };

  function renderText() {
    document.body.classList.toggle('script-dev', script === 'dev');
    document.querySelectorAll('.t').forEach(el => {
      const hi = el.dataset.l === 'hi';
      let out;
      if (script === 'dev') out = el.dataset.dev;
      else {
        let ia = hi ? el.dataset.iast : devaToIast(el.dataset.dev);
        if (el.hasAttribute('data-cap')) ia = capFirst(ia);
        out = script === 'iast' ? ia : script === 'plain' ? toPlain(ia, hi) : toCyr(ia, hi, script === 'cyrs');
      }
      el.textContent = out;
      el.lang = (hi ? 'hi-' : 'pi-') + SCRIPT_LANG[script];
    });
    document.querySelectorAll('.n').forEach(el => {
      const n = script === 'dev' ? el.dataset.n.replace(/\d/g, d => DEV_DIGITS[d]) : el.dataset.n;
      el.textContent = el.dataset.f.replace('%', n);
    });
    updatePlayer();
  }

  function renderLang() {
    const L = UI[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = L[el.dataset.i18n]; });
    document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = L[el.dataset.i18nTitle]; });
    const order = lang === 'ru' ? ['ru', 'en'] : ['en', 'ru'];
    document.querySelectorAll('.tr').forEach(el => {
      el.replaceChildren(...order.map(code => {
        const s = document.createElement('span');
        s.className = 'tr-l';
        s.lang = code;
        s.textContent = el.dataset[code];
        return s;
      }));
    });
    $('pl-prev').setAttribute('aria-label', L.prev);
    $('pl-next').setAttribute('aria-label', L.next);
    $('pl-close').setAttribute('aria-label', L.close);
    updatePlayer();
  }

  // ---------- player ----------
  const $ = id => document.getElementById(id);
  const lines = [...document.querySelectorAll('.ln')];
  if ('ResizeObserver' in window) {
    new ResizeObserver(() => {
      const h = $('player').offsetHeight;
      if (h) document.documentElement.style.setProperty('--pl-h', h + 'px');
    }).observe($('player'));
  }
  const audio = new Audio();
  audio.preload = 'none';
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ICON_PLAY = 'M4 2v12l10-6z', ICON_PAUSE = 'M3 2h3.5v12H3zM9.5 2H13v12H9.5z';

  let idx = -1, playing = false, pageMode = false, t0 = 0, done = 0, dur = 0, raf = 0;

  const toSec = v => typeof v === 'number' ? v : String(v).split(':').map(Number).reduce((a, b) => a * 60 + b, 0);
  function cueFor(i) {
    const c = i >= 0 && CUES[lines[i].dataset.id];
    if (!c || !SOURCES[c[0]]) return null;
    return { src: SOURCES[c[0]], start: toSec(c[1]), end: toSec(c[2]) };
  }
  const lineText = el => [...el.querySelectorAll('.n, .t')].map(x => x.textContent).join(' ').replace(/\s+/g, ' ').trim();
  const demoDur = el => Math.min(7, Math.max(2.5, 1.5 + lineText(el).length * 0.045));
  const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + String(r).padStart(2, '0'); };

  function elapsed() {
    const c = cueFor(idx);
    if (c) return Math.max(0, audio.currentTime - c.start);
    return playing ? done + (performance.now() - t0) / 1000 : done;
  }

  function start(i, scroll) {
    if (i < 0 || i >= lines.length) return;
    cancelAnimationFrame(raf);
    audio.pause();
    lines.forEach(l => { l.classList.remove('on'); l.removeAttribute('aria-current'); });
    idx = i;
    const el = lines[i];
    el.classList.add('on');
    el.setAttribute('aria-current', 'true');
    $('player').hidden = false;
    document.body.classList.add('has-player');
    if (scroll) el.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
    const c = cueFor(i);
    if (c) {
      if (audio.dataset.src !== c.src) { audio.src = c.src; audio.dataset.src = c.src; }
      audio.currentTime = c.start;
      dur = c.end - c.start;
      audio.play().catch(() => {});
    } else {
      dur = demoDur(el);
    }
    done = 0;
    t0 = performance.now();
    playing = true;
    loop();
    updatePlayer();
  }

  function loop() {
    cancelAnimationFrame(raf);
    const step = () => {
      const e = elapsed();
      setProgress(e);
      if (e >= dur) { finished(); return; }
      if (playing) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  function pause() {
    if (!playing) return;
    if (cueFor(idx)) audio.pause(); else done = elapsed();
    playing = false;
    cancelAnimationFrame(raf);
    updatePlayer();
  }

  function resume() {
    if (playing || idx < 0) return;
    if (elapsed() >= dur) { start(idx, false); return; }
    if (cueFor(idx)) audio.play().catch(() => {}); else t0 = performance.now();
    playing = true;
    loop();
    updatePlayer();
  }

  function finished() {
    playing = false;
    audio.pause();
    setProgress(dur);
    if (pageMode && idx < lines.length - 1) start(idx + 1, true);
    else { pageMode = false; updatePlayer(); }
  }

  function closePlayer() {
    pause();
    pageMode = false;
    lines.forEach(l => { l.classList.remove('on'); l.removeAttribute('aria-current'); });
    idx = -1;
    $('player').hidden = true;
    document.body.classList.remove('has-player');
    updatePlayer();
  }

  function setProgress(e) {
    $('pl-prog').style.width = (dur ? Math.min(100, e / dur * 100) : 0) + '%';
    $('pl-time').textContent = fmt(e) + ' / ' + fmt(dur);
  }

  function updatePlayer() {
    const L = UI[lang];
    $('pl-icon').firstElementChild.setAttribute('d', playing ? ICON_PAUSE : ICON_PLAY);
    $('pl-toggle').setAttribute('aria-label', playing ? L.pause : L.play);
    const pagePlaying = pageMode && playing;
    $('pa-label').textContent = pagePlaying ? L.pausePage : L.playPage;
    $('pa-icon').firstElementChild.setAttribute('d', pagePlaying ? ICON_PAUSE : ICON_PLAY);
    if (idx < 0) return;
    $('pl-text').textContent = lineText(lines[idx]);
    const tr = TR[lines[idx].dataset.id];
    const order = lang === 'ru' ? [['ru', 1], ['en', 0]] : [['en', 0], ['ru', 1]];
    $('pl-tr').replaceChildren(...(tr ? order.map(([code, k]) => {
      const p = document.createElement('p'), tag = document.createElement('span'), txt = document.createElement('span');
      tag.className = 'pl-tag';
      tag.textContent = code.toUpperCase();
      txt.textContent = tr[k];
      txt.lang = code;
      p.append(tag, txt);
      return p;
    }) : []));
    $('pl-count').textContent = L.lineOf.replace('{n}', idx + 1).replace('{N}', lines.length);
    $('pl-note').textContent = cueFor(idx) ? '' : L.demo;
    $('pl-prev').disabled = idx === 0;
    $('pl-next').disabled = idx === lines.length - 1;
    setProgress(elapsed());
  }

  lines.forEach((el, i) => {
    el.addEventListener('click', () => {
      if (i === idx) playing ? pause() : resume();
      else start(i, false);
    });
    if (el.tagName !== 'BUTTON') el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
    });
  });
  $('pl-toggle').addEventListener('click', () => playing ? pause() : resume());
  $('pl-prev').addEventListener('click', () => start(idx - 1, true));
  $('pl-next').addEventListener('click', () => start(idx + 1, true));
  $('pl-close').addEventListener('click', closePlayer);
  $('play-all').addEventListener('click', () => {
    if (pageMode && playing) pause();
    else if (pageMode && idx >= 0) resume();
    else { pageMode = true; start(0, true); }
  });
  audio.addEventListener('ended', () => { if (playing) finished(); });

  // ---------- switches ----------
  document.querySelectorAll('input[name="script"]').forEach(r => {
    r.checked = r.value === script;
    r.addEventListener('change', () => { script = r.value; store.set('mspm-script', script); renderText(); });
  });
  document.querySelectorAll('input[name="lang"]').forEach(r => {
    r.checked = r.value === lang;
    r.addEventListener('change', () => { lang = r.value; store.set('mspm-lang', lang); renderLang(); });
  });

  renderLang();
  renderText();
})();
</script>
</body>
</html>
