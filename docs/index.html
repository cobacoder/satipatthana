<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mahāsatipaṭṭhāna Sutta in tables: Pali in IAST, Cyrillic or Devanagari, with an English and Russian translation and an audio explanation for every line.">
<title>Mahāsatipaṭṭhāna Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Noto+Sans:wght@400;600&family=Tiro+Devanagari+Sanskrit&display=swap">
<style>
/* Layout: a printed study sheet. Ink-ruled boxes and arrows on paper; the line being explained is marked as if with a highlighter. */
:root {
  --paper: #F3F3EF;
  --sheet: #FFFFFD;
  --ink: #1C1B18;
  --rule: #2E2C27;
  --muted: #69655B;
  --hair: #DCD9CF;
  --ochre: #94570A;
  --mark: #FBE29A;
  --hover: #F3ECDC;
  --bar: #1F1E1A;
  --bar-fg: #F4F2EC;
  --bar-muted: #B5B0A4;
  --bar-track: #3A3833;
  --bar-accent: #E9AA50;
  --bar-on-accent: #1F1E1A;
  --f-text: "Gentium Book Plus", "Noto Serif", "Times New Roman", serif;
  --f-deva: "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
  --f-ui: "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --lw: 1.5px;
  --pl-h: 150px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11110F; --sheet: #191916; --ink: #ECE9E1; --rule: #C8C3B5; --muted: #A29D91;
    --hair: #34322C; --ochre: #E7A84E; --mark: #5B4613; --hover: #25221A;
    --bar: #2A2924; --bar-fg: #ECE9E1; --bar-muted: #A29D91; --bar-track: #45433C;
    --bar-accent: #E9AA50; --bar-on-accent: #1F1E1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11110F; --sheet: #191916; --ink: #ECE9E1; --rule: #C8C3B5; --muted: #A29D91;
  --hair: #34322C; --ochre: #E7A84E; --mark: #5B4613; --hover: #25221A;
  --bar: #2A2924; --bar-fg: #ECE9E1; --bar-muted: #A29D91; --bar-track: #45433C;
  --bar-accent: #E9AA50; --bar-on-accent: #1F1E1A;
  color-scheme: dark;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-text);
  font-size: 17px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
body.has-player { padding-bottom: calc(var(--pl-h) + 28px); }
[hidden] { display: none !important; }
img { max-width: 100%; }

.sheet {
  max-width: 920px;
  margin: 0 auto;
  background: var(--sheet);
  border: 1px solid var(--hair);
  padding: clamp(20px, 4.5vw, 48px);
  display: grid;
  gap: 2rem;
}

/* ---------- header ---------- */
.top { display: grid; gap: .9rem; }
.eyebrow {
  margin: 0;
  font-family: var(--f-ui);
  font-size: .75rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
h1 {
  margin: 0;
  font-size: clamp(1.75rem, 4.2vw, 2.4rem);
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -.01em;
  text-wrap: balance;
}
.credit { margin: 0; color: var(--muted); max-width: 60ch; }

.tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .75rem 1.5rem;
  font-family: var(--f-ui);
  font-size: .8125rem;
  padding-top: .9rem;
  border-top: 1px solid var(--hair);
}
.seg { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.seg-label { color: var(--muted); letter-spacing: .04em; }
.seg-opts { display: flex; flex-wrap: wrap; padding: 0 1px 1px 0; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.seg label {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 1px;
  padding: .34rem .7rem;
  margin: 0 -1px -1px 0;
  border: 1px solid var(--rule);
  cursor: pointer;
  line-height: 1.2;
  white-space: nowrap;
}
.seg label:hover { background: var(--hover); }
.seg input:checked + label { background: var(--ink); color: var(--sheet); z-index: 1; }
.seg input:focus-visible + label { outline: 2px solid var(--ochre); outline-offset: 2px; z-index: 2; }
.o-ex { font-family: var(--f-text); font-size: .82rem; color: var(--muted); }
.seg input:checked + label .o-ex { color: inherit; opacity: .75; }
.seg label[lang="hi"], .seg label[lang="hi"] .o-ex { font-family: var(--f-deva); }

.play-all {
  all: unset;
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  padding: .45rem .95rem .45rem .75rem;
  border: 1px solid var(--rule);
  cursor: pointer;
  font-weight: 600;
  margin-left: auto;
}
.play-all:hover { background: var(--hover); }
.play-all:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
.play-all svg { width: 14px; height: 14px; fill: currentColor; }
.hint { margin: 0; font-family: var(--f-ui); font-size: .8125rem; color: var(--muted); max-width: 80ch; }

.pager-row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; font-family: var(--f-ui); font-size: .8125rem; }
.pager { display: flex; flex-wrap: wrap; gap: .3rem; }
.pg {
  min-width: 2.1rem;
  height: 2.1rem;
  display: grid;
  place-items: center;
  border: 1px solid var(--rule);
  color: inherit;
  text-decoration: none;
  font-variant-numeric: tabular-nums;
}
.pg:hover { background: var(--hover); }
.pg[aria-current] { background: var(--ink); color: var(--sheet); }
.pg:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }

/* ---------- text units ---------- */
.script-dev .t { font-family: var(--f-deva); font-size: 1.04em; }
.ml { white-space: pre-line; }

.ln {
  all: unset;
  box-sizing: border-box;
  display: flex;
  align-items: baseline;
  gap: .55em;
  width: 100%;
  padding: .34em .65em;
  cursor: pointer;
  scroll-margin: 90px 0 calc(var(--pl-h) + 20px);
  transition: background-color .15s;
}
.ln:hover { background: var(--hover); }
.ln.on { background: var(--mark); }
.ln:focus-visible { outline: 2px solid var(--ochre); outline-offset: -2px; }
.ln .n { color: var(--muted); min-width: 2.1em; flex: none; font-variant-numeric: tabular-nums; }
.ln .t { min-width: 0; }

.tr { font-family: var(--f-ui); font-size: .8125rem; color: var(--muted); margin: 0; }
.tr-l { display: block; }
.hi { display: inline-grid; gap: .15rem; }

/* ---------- page blocks ---------- */
.page { display: grid; gap: .9rem; }
.page > .sec-h { margin-top: 1.6rem; }
.page > .sec-h:first-child, .page > .big-h:first-child { margin-top: 0; }
.sec-h {
  margin: 0;
  font-size: 1.2rem;
  line-height: 1.35;
  font-weight: 700;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: .2rem .6rem;
  text-wrap: balance;
}
.sec-h .n { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.sec-h .gl { font-weight: 400; font-style: italic; font-size: .85em; color: var(--muted); }
.script-dev .sec-h .gl { font-style: normal; }
.sec-h + .tr { margin-top: -.6rem; }
.big-h { margin: 0; justify-self: center; font-size: 1.45rem; text-align: center; }
.big-h + .tr { justify-self: center; text-align: center; margin-top: -.6rem; }

.prose { margin: 0; max-width: 72ch; }
.prose.center { justify-self: center; text-align: center; }
.prose .ln, .boxp .ln {
  display: inline;
  width: auto;
  padding: .06em .12em;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
.prose .ln .n, .boxp .ln .n { margin-right: .3em; min-width: 0; }

.box { border: var(--lw) solid var(--rule); background: var(--sheet); }
.boxp { margin: 0; padding: .55em .75em; }
.lines { display: grid; }
.lines.box { justify-self: start; max-width: 100%; }
.lines.center { justify-self: center; }
.lines.center .ln { justify-content: center; text-align: center; }
.lines.indent { padding-left: clamp(1rem, 12vw, 9rem); }
.lines.stack > .ln + .ln { border-top: var(--lw) solid var(--rule); }
.lines.solo .ln { flex-direction: column; align-items: center; text-align: center; padding: .7em 1em; line-height: 1.55; }

.arr { display: flex; color: var(--rule); }
.arr-r { align-items: center; min-width: 2.25rem; }
.arr-r::before { content: ""; flex: 1; border-top: var(--lw) solid currentColor; }
.arr-r::after { content: ""; border-left: 8px solid currentColor; border-block: 4.5px solid transparent; }
.arr-d { flex-direction: column; align-items: center; height: 1.6rem; }
.arr-d::before { content: ""; flex: 1; border-left: var(--lw) solid currentColor; }
.arr-d::after { content: ""; border-top: 8px solid currentColor; border-inline: 4.5px solid transparent; }
.solo-d { justify-self: center; margin-block: -.5rem; }
.m-only { display: none; }
.plus { justify-self: center; font-size: 1.5rem; line-height: 1; margin-block: -.4rem; }
.marks { justify-self: center; color: var(--muted); letter-spacing: .25em; font-size: .85rem; margin-block: -.5rem; }

.cap { margin: 0; text-align: center; display: grid; gap: .2rem; justify-items: center; }
.cap.left { text-align: left; justify-items: start; }
.cap .t { font-style: italic; color: var(--muted); max-width: 72ch; }
.script-dev .cap .t { font-style: normal; }
.cap .tr { max-width: 72ch; }

.leader-box { display: grid; }
.ln.leader { align-items: baseline; gap: .5em; }
.ln.leader .dots { flex: 1; min-width: 2rem; border-bottom: 2px dotted var(--muted); transform: translateY(-.25em); }
.leader-note { justify-items: center; text-align: center; padding: 0 .65em .45em; }
.leader-note .t { font-size: .9em; color: var(--muted); font-style: italic; }
.script-dev .leader-note .t { font-style: normal; }

/* rows that each point to one shared box */
.fan { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(2.25rem, 4rem) minmax(0, 1fr); }
.fan.fan-v { grid-template-columns: minmax(0, 1fr) minmax(2.25rem, 5rem) max-content; }
.fan > .fl { grid-column: 1; border: var(--lw) solid var(--rule); border-top: 0; background: var(--sheet); }
.fan > .fl.first { border-top: var(--lw) solid var(--rule); }
.fan > .fa { grid-column: 2; align-self: center; }
.fan > .fan-d { display: none; }
.fan > .fr { grid-column: 3; display: grid; align-content: center; }
.fan > .fr.sub { grid-template-rows: repeat(4, 1fr); align-content: stretch; }
@supports (grid-template-rows: subgrid) { .fan > .fr.sub { grid-template-rows: subgrid; } }
.fan > .fr.sub .ln { align-items: center; }
.vbox { justify-items: center; }
.vbox .ln { flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: .5em .9em; }
.vt { display: flex; flex-direction: column; align-items: center; line-height: 1.55; }
.vt .sy { display: block; }

.flow { display: grid; grid-template-columns: var(--cols, max-content minmax(2.5rem, 5rem) minmax(0, 1fr)); align-items: center; }
.flow > .box { align-self: center; }
.flow > .boxp { font-size: .95rem; }

.bf { display: grid; grid-template-columns: max-content minmax(2.75rem, 6rem) max-content; justify-content: center; align-items: center; }
.brk { position: relative; display: grid; padding: .3rem .85rem; }
.brk::before, .brk::after { content: ""; position: absolute; top: 0; bottom: 0; width: .5rem; border: var(--lw) solid var(--rule); }
.brk::before { left: 0; border-right: 0; }
.brk::after { right: 0; border-left: 0; }
.brk .ln { padding: .14em .4em; }

.ten { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 1.75rem; row-gap: .1rem; }
.ten .ln { padding: .3em .45em; }

.chips { display: grid; gap: .6rem; }
.chips-side .t { font-style: italic; color: var(--muted); }
.script-dev .chips-side .t { font-style: normal; }
.chips-row { display: grid; grid-template-columns: 10.5rem minmax(0, 1fr); gap: .4rem 1rem; align-items: start; border-top: 1px solid var(--hair); padding-top: .5rem; }
.chips-label { display: flex; flex-wrap: wrap; gap: .3rem .5rem; align-items: baseline; }
.chips-label .count { border: var(--lw) solid var(--rule); border-radius: 50%; min-width: 1.9rem; height: 1.9rem; display: inline-grid; place-items: center; font-size: .85rem; }
.chips-list { display: flex; flex-wrap: wrap; gap: .05rem .15rem; }
.ln.chip { width: auto; padding: .2em .45em; }
.ln.chip .n { min-width: 0; }

.tbl-wrap { overflow-x: auto; max-width: 100%; justify-self: center; }
.tbl { border-collapse: collapse; }
.tbl th, .tbl td { border: var(--lw) solid var(--rule); padding: 0; vertical-align: middle; font-weight: 400; }
.tbl .hi { padding: .35em .65em; text-align: left; }
.tbl .tr { font-size: .75rem; }
.ref { all: unset; box-sizing: border-box; display: block; width: 100%; padding: .45em .9em; cursor: pointer; text-align: center; color: var(--muted); }
.ref:hover { background: var(--hover); }
.ref:focus-visible { outline: 2px solid var(--ochre); outline-offset: -2px; }

.pairs { display: grid; gap: .5rem; }
.pairs-head, .pair { display: grid; grid-template-columns: minmax(0, 1fr) 13rem; gap: 1rem; align-items: center; }
.pairs-head .t { font-style: italic; color: var(--muted); }
.script-dev .pairs-head .t { font-style: normal; }
.pair { border-top: 1px solid var(--hair); padding-top: .3rem; }
.pair-label { color: var(--muted); }

.terms { display: grid; gap: .5rem; }
.terms-lead .t { font-style: italic; color: var(--muted); }
.script-dev .terms-lead .t { font-style: normal; }
.terms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .6rem; }
.term { display: grid; gap: .1rem; align-content: start; justify-items: center; text-align: center; border-top: 1px solid var(--hair); padding-top: .3rem; }
.term .ln { justify-content: center; }
.term-gl .t { color: var(--muted); }
.gl-s { justify-items: center; }
.gl-s .t { font-size: .85em; color: var(--muted); }

.mat { display: grid; gap: .55rem; }
.mat-title { justify-self: center; }
.mat-title .t { font-weight: 700; }
.mat-note { justify-self: center; text-align: center; max-width: 72ch; }
.mat-note .t { font-style: italic; color: var(--muted); }
.script-dev .mat-note .t { font-style: normal; }
.corner { color: var(--muted); padding: .4em .6em !important; font-family: var(--f-ui); }
.colh .ln { flex-direction: column; align-items: center; gap: 0; text-align: center; padding: .35em .5em; }
.colh .cn { display: block; text-align: center; color: var(--muted); font-size: .8em; }
.colh .cn .n { min-width: 0; }
.colh > .cn { padding-bottom: .25em; }
.colh.sel { background: var(--hover); }
.colh .hi { padding: 0 .4em; justify-items: center; }
.rowh { text-align: left; }
.mat-tbl .rowh { min-width: 17rem; }
.rowh > .n { color: var(--muted); padding: 0 .3em 0 .6em; }
.matb-tbl .rowh { min-width: 10.5rem; }
.matb-tbl .rowh .hi { display: inline-grid; padding-left: .2em; }
.ln.cell { justify-content: center; align-items: center; min-height: 2.6rem; min-width: 3.4rem; }
.cell-dot { width: .38rem; height: .38rem; border-radius: 50%; background: var(--hair); }
.ln.cell:hover .cell-dot, .ln.cell.on .cell-dot { background: var(--ochre); }
.ln.cell.filled { flex-direction: column; align-items: stretch; gap: 0; font-size: .9rem; line-height: 1.3; padding: .3em .45em; }
.ln.cell.filled .n { align-self: flex-end; min-width: 0; font-size: .78em; }
.matb-tpl { justify-self: start; max-width: 72ch; }

.g6 { border-collapse: collapse; }
.g6 td, .g6 th { padding: .1rem .35rem; text-align: center; font-weight: 400; vertical-align: top; }
.g6 .ln { justify-content: center; padding: .2em .4em; }
.g6-n { color: var(--muted); font-size: .85rem; }
.g6-l { text-align: left !important; white-space: nowrap; }
.g6-l .t { color: var(--muted); }
.g6-a .arr-d { height: 1.2rem; }

.ayt-wrap { display: grid; gap: .55rem; }
.ayt { display: grid; grid-template-columns: max-content minmax(2rem, 3.5rem) max-content minmax(2rem, 3.5rem) minmax(0, 1fr); align-items: center; }
.ayt-pairs { display: grid; }
.ayt-pair + .ayt-pair { border-top: 0; }
.ayt-pair .ln { justify-content: center; padding: .25em .9em; }
.ayt-pair .ln + .ln { border-top: 1px dashed var(--rule); }
.ayt-st .ln { padding-block: .7em; }

.supp { display: grid; gap: .6rem; border-top: 1px dashed var(--rule); padding-top: 1rem; margin-top: .5rem; }
.supp-label { margin: 0; font-family: var(--f-ui); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- footer ---------- */
.foot { display: grid; gap: 1rem; border-top: 1px solid var(--hair); padding-top: 1.25rem; font-family: var(--f-ui); font-size: .8125rem; color: var(--muted); }
.foot p { margin: 0; max-width: 70ch; }
.pg-nav { display: flex; justify-content: space-between; gap: 1rem; }
.pg-btn {
  all: unset;
  box-sizing: border-box;
  padding: .5rem .9rem;
  border: 1px solid var(--rule);
  color: var(--ink);
  cursor: pointer;
  font-weight: 600;
}
.pg-btn:hover { background: var(--hover); }
.pg-btn:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
.pg-btn:disabled { opacity: .35; cursor: default; }
.scan summary { cursor: pointer; color: var(--ink); font-weight: 600; width: fit-content; }
.scan summary:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
.scan img { display: block; margin-top: .9rem; width: 100%; max-width: 560px; height: auto; border: 1px solid var(--hair); }

/* ---------- player ---------- */
.player {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: var(--bar);
  color: var(--bar-fg);
  font-family: var(--f-ui);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.pl-in { max-width: 920px; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.pl-ctl { display: flex; gap: 2px; align-items: center; }
.ib {
  all: unset;
  box-sizing: border-box;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  cursor: pointer;
  color: var(--bar-fg);
}
.ib:hover { background: var(--bar-track); }
.ib:focus-visible { outline: 2px solid var(--bar-accent); outline-offset: 1px; }
.ib svg { width: 16px; height: 16px; fill: currentColor; }
.ib.main { width: 44px; height: 44px; background: var(--bar-accent); color: var(--bar-on-accent); }
.ib.main:hover { background: var(--bar-accent); filter: brightness(1.08); }
.ib:disabled { opacity: .35; cursor: default; }
.pl-info { min-width: 0; display: grid; gap: 6px; max-height: min(46vh, 340px); overflow-y: auto; }
.pl-text { font-family: var(--f-text); font-size: 1.05rem; line-height: 1.35; }
.script-dev .pl-text { font-family: var(--f-deva); }
.pl-tr { display: grid; gap: 3px; font-size: .84rem; line-height: 1.4; }
.pl-tr p { margin: 0; display: grid; grid-template-columns: 1.9rem minmax(0, 1fr); gap: .4rem; }
.pl-tag { font-size: .66rem; letter-spacing: .08em; color: var(--bar-muted); padding-top: .22em; }
.pl-meta { font-size: .75rem; color: var(--bar-muted); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 0 .9em; }
.pl-track { height: 3px; background: var(--bar-track); }
.pl-prog { display: block; height: 100%; width: 0; background: var(--bar-accent); }

@media (max-width: 700px) {
  body { font-size: 16px; padding-block: 16px 32px; }
  .sheet { border: 0; padding: 4px 0 0; background: transparent; gap: 1.75rem; }
  .box, .fan > .fl { background: transparent; }
  .play-all { margin-left: 0; }
  .d-only { display: none; }
  .m-only { display: flex; }
  .flow, .ayt { display: flex; flex-direction: column; align-items: stretch; }
  .flow > .arr-d, .ayt > .arr-d { align-self: center; }
  .flow > .lines.solo { align-self: center; }
  .fan { display: flex; flex-direction: column; }
